services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-regcheck}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-regcheck}
      DOCUMENT_STORAGE_DIR: /data/uploads
      REMOTE_DOCUMENT_HOSTS: ${REMOTE_DOCUMENT_HOSTS:-lex.uz,www.lex.uz,cbu.uz,www.cbu.uz}
      REMOTE_DOCUMENT_MAX_BYTES: ${REMOTE_DOCUMENT_MAX_BYTES:-20971520}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      AUTO_ASSESS_UPDATES: ${AUTO_ASSESS_UPDATES:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      REGULATORY_MONITOR_ENABLED: ${REGULATORY_MONITOR_ENABLED:-true}
      REGULATORY_REVIEWER_EMAILS: ${REGULATORY_REVIEWER_EMAILS:-}
      REGULATORY_CHECK_INTERVAL_MINUTES: ${REGULATORY_CHECK_INTERVAL_MINUTES:-60}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - document_uploads:/data/uploads

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "start:worker", "-w", "@regcheck/api"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-regcheck}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-regcheck}
      DOCUMENT_STORAGE_DIR: /data/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-none}
      ASSESSMENT_COMPARISON_CONCURRENCY: ${ASSESSMENT_COMPARISON_CONCURRENCY:-2}
      ASSESSMENT_BATCH_SIZE: ${ASSESSMENT_BATCH_SIZE:-8}
      ASSESSMENT_MAX_COST_USD: ${ASSESSMENT_MAX_COST_USD:-2}
      AUTO_ASSESS_UPDATES: ${AUTO_ASSESS_UPDATES:-true}
      REGULATORY_MONITOR_ENABLED: ${REGULATORY_MONITOR_ENABLED:-true}
      REGULATORY_CHECK_INTERVAL_MINUTES: ${REGULATORY_CHECK_INTERVAL_MINUTES:-60}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - document_uploads:/data/uploads
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-regcheck}
      POSTGRES_USER: ${POSTGRES_USER:-regcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-regcheck} -d ${POSTGRES_DB:-regcheck}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  document_uploads:
